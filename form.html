<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="author" content="Emerson">
  <meta name="description" content="Product review form where users rate a product, choose useful features and write a review.">
  <title>Product Review Form</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&family=Poppins:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/form.css">
  <script src="scripts/form.js" defer></script>
</head>
<body>
  <header>
    <h1>Product Review</h1>
  </header>

  <main>
    <form action="review.html" method="get">

      <div class="field">
        <label for="productName">Product Name</label>
        <select id="productName" name="productName" required>
          <option value="" disabled selected>Select a Product ...</option>
        </select>
      </div>

      <fieldset class="rating">
        <legend>Overall Rating</legend>
        <div class="rating-options">
          <div class="rating-option">
            <label for="rating1">&star;<span class="visually-hidden"> 1 star</span></label>
            <input type="radio" id="rating1" name="rating" value="1" required>
          </div>
          <div class="rating-option">
            <label for="rating2">&star;&star;<span class="visually-hidden"> 2 stars</span></label>
            <input type="radio" id="rating2" name="rating" value="2">
          </div>
          <div class="rating-option">
            <label for="rating3">&star;&star;&star;<span class="visually-hidden"> 3 stars</span></label>
            <input type="radio" id="rating3" name="rating" value="3">
          </div>
          <div class="rating-option">
            <label for="rating4">&star;&star;&star;&star;<span class="visually-hidden"> 4 stars</span></label>
            <input type="radio" id="rating4" name="rating" value="4">
          </div>
          <div class="rating-option">
            <label for="rating5">&star;&star;&star;&star;&star;<span class="visually-hidden"> 5 stars</span></label>
            <input type="radio" id="rating5" name="rating" value="5">
          </div>
        </div>
      </fieldset>

      <div class="field">
        <label for="installDate">Date of Installation</label>
        <input type="date" id="installDate" name="installDate" required>
      </div>

      <fieldset class="features">
        <legend>Which features did you find useful in the product? <em>(Check all that apply)</em></legend>
        <div class="check">
          <input type="checkbox" id="durability" name="features" value="durability">
          <label for="durability">Durability</label>
        </div>
        <div class="check">
          <input type="checkbox" id="easeOfUse" name="features" value="ease-of-use">
          <label for="easeOfUse">Ease of Use</label>
        </div>
        <div class="check">
          <input type="checkbox" id="performance" name="features" value="performance">
          <label for="performance">Performance</label>
        </div>
        <div class="check">
          <input type="checkbox" id="design" name="features" value="design">
          <label for="design">Design</label>
        </div>
      </fieldset>

      <div class="field">
        <label for="writtenReview">Written Review <small>(Optional)</small></label>
        <textarea id="writtenReview" name="writtenReview" rows="5"></textarea>
      </div>

      <div class="field">
        <label for="userName">Your Name <small>(Optional)</small></label>
        <input type="text" id="userName" name="userName" autocomplete="name">
      </div>

      <input type="submit" value="Post Review">
    </form>
  </main>

  <footer>
    <p>&copy; <span id="year"></span> Emerson</p>
    <p>Last Modification: <span id="lastModified"></span></p>
  </footer>
</body>
</html>
